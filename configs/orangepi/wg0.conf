# ==============================================================================
# /etc/wireguard/wg0.conf — WireGuard клиент на Orange Pi 4 LTS
# ==============================================================================
# Особенности:
# - Table = off: Отключаем автоматическое добавление default route в таблицу main
# - PBR (таблица 200): Весь трафик локальной сети 192.168.1.0/24 заворачивается в туннель
# - Анти-петля: Трафик до публичного IP ЦОД (203.0.113.186) идет через таблицу main
# - Изоляция: Трафик с домашнего сервера (192.168.1.10) принудительно дропается в туннель
# ==============================================================================

[Interface]
PrivateKey = <ORANGE_PI_PRIVATE_KEY>
Address = 10.0.20.2/24
Table = off

# 1. Локальные адреса подсети LAN направляем в таблицу main
PostUp = ip rule add to 192.168.1.0/24 priority 90 table main 2>/dev/null || true

# 2. АНТИ-ПЕТЛЯ: Трафик до эндпоинта ЦОД отправляем через физический шлюз (main)
PostUp = ip rule add to 203.0.113.186 priority 95 table main 2>/dev/null || true

# 3. ИЗОЛЯЦИЯ: Домашний сервер (192.168.1.10) отправляем через main и дропаем в туннель
PostUp = ip rule add from 192.168.1.10 priority 98 table main 2>/dev/null || true
PostUp = iptables -I FORWARD 1 -s 192.168.1.10 -o %i -j DROP

# 4. Весь остальной трафик LAN (192.168.1.0/24) направляем в таблицу 200
PostUp = ip rule add from 192.168.1.0/24 priority 100 table 200 2>/dev/null || true
PostUp = ip route replace 192.168.1.0/24 dev eth0 table 200
PostUp = ip route replace default dev %i table 200
PostUp = iptables -t nat -C POSTROUTING -o %i -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o %i -j MASQUERADE

# --- Правила очистки при остановке туннеля ---
PostDown = ip rule del to 192.168.1.0/24 priority 90 table main 2>/dev/null || true
PostDown = ip rule del to 203.0.113.186 priority 95 table main 2>/dev/null || true
PostDown = ip rule del from 192.168.1.10 priority 98 table main 2>/dev/null || true
PostDown = iptables -D FORWARD -s 192.168.1.10 -o %i -j DROP 2>/dev/null || true
PostDown = ip rule del from 192.168.1.0/24 priority 100 table 200 2>/dev/null || true
PostDown = ip route flush table 200 2>/dev/null || true
PostDown = iptables -t nat -D POSTROUTING -o %i -j MASQUERADE 2>/dev/null || true

[Peer]
PublicKey = <SERVER_HQ_PUBLIC_KEY>
Endpoint = 203.0.113.186:51823
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
