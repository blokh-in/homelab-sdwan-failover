# ==============================================================================
# /etc/wireguard/wg-snr.conf — WireGuard сервер в ЦОД для роутера (Резервный DNS)
# ==============================================================================
# Особенности:
# - Жесткий белый список: разрешен ТОЛЬКО трафик DNS (порт 53 UDP/TCP) к серверу
# - FORWARD полностью запрещен (роутер не может пустить весь интернет через этот туннель)
# - Используется исключительно для failover резолвинга DNS домашней сети
# ==============================================================================

[Interface]
Address = 10.0.10.1/24
ListenPort = 51822
PrivateKey = <SERVER_HQ_BACKUP_PRIVATE_KEY>

# Опционально: распределение сетевых прерываний
# PostUp = echo 1000001 > /sys/class/net/%i/queues/rx-0/rps_cpus

# Жесткий файрвол: разрешаем ТОЛЬКО DNS (UDP/TCP 53) на сам сервер, остальное дропаем
PostUp = iptables -A INPUT -i %i -p udp --dport 53 -j ACCEPT
PostUp = iptables -A INPUT -i %i -p tcp --dport 53 -j ACCEPT
PostUp = iptables -A INPUT -i %i -j DROP
PostUp = iptables -A FORWARD -i %i -j DROP

# Очистка правил при выключении туннеля
PostDown = iptables -D INPUT -i %i -p udp --dport 53 -j ACCEPT
PostDown = iptables -D INPUT -i %i -p tcp --dport 53 -j ACCEPT
PostDown = iptables -D INPUT -i %i -j DROP
PostDown = iptables -D FORWARD -i %i -j DROP

[Peer]
# Клиент: Домашний роутер SNR-CPE-AX1 (OpenWrt)
PublicKey = <ROUTER_SNR_PUBLIC_KEY>
AllowedIPs = 10.0.10.2/32
