# ==============================================================================
# /etc/wireguard/wg-opi.conf — WireGuard сервер в ЦОД для Orange Pi (Основной шлюз)
# ==============================================================================
# Особенности:
# - RPS (Receive Packet Steering) оптимизация распределения сетевых прерываний
# - Строгая анти-торрент фильтрация в FORWARD (L7 string matching + P2P порты)
# - NAT (MASQUERADE) в интернет через внешний сетевой интерфейс eno1
# - Изоляция других туннелей (дроп трафика в wg0 и wg-snr)
# ==============================================================================

[Interface]
Address = 10.0.20.1/24
ListenPort = 51823
PrivateKey = <SERVER_HQ_PRIVATE_KEY>

# Опционально: распределение RPS по ядрам CPU
# PostUp = echo 1000001 > /sys/class/net/%i/queues/rx-0/rps_cpus

# Разрешаем входящий трафик на сам сервер из туннеля (для проверки связи / ICMP пинга)
PostUp = iptables -A INPUT -i %i -j ACCEPT

# --- АНТИ-ТОРРЕНТ ЗАЩИТА (В начале цепочки FORWARD) ---
# Проверка сигнатур незашифрованного BitTorrent/DHT в первых 4 пакетах соединения:
PostUp = iptables -I FORWARD 1 -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "BitTorrent protocol" --algo bm --to 1500 -j DROP
PostUp = iptables -I FORWARD 1 -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "info_hash=" --algo bm --to 1500 -j DROP
PostUp = iptables -I FORWARD 1 -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "get_peers" --algo bm --to 1500 -j DROP
PostUp = iptables -I FORWARD 1 -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "announce_peer" --algo bm --to 1500 -j DROP

# Блокировка стандартных P2P портов
PostUp = iptables -I FORWARD 1 -i %i -p tcp -m multiport --dports 6881:6889 -j DROP
PostUp = iptables -I FORWARD 1 -i %i -p udp -m multiport --dports 6881:6889 -j DROP

# Ограничение количества одновременных TCP SYN соединений (защита от сканирования / флуда)
# PostUp = iptables -I FORWARD 1 -i %i -p tcp --syn -m connlimit --connlimit-above 40 --connlimit-mask 32 -j DROP

# Разрешаем маршрутизацию в интернет через внешний интерфейс eno1
PostUp = iptables -A FORWARD -i %i -o eno1 -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o eno1 -j MASQUERADE

# Изоляция от других туннельных интерфейсов
PostUp = iptables -A FORWARD -i %i -o wg0 -j DROP
PostUp = iptables -A FORWARD -i %i -o wg-snr -j DROP

# --- Очистка правил iptables при выключении туннеля ---
PostDown = iptables -D INPUT -i %i -j ACCEPT
PostDown = iptables -D FORWARD -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "BitTorrent protocol" --algo bm --to 1500 -j DROP
PostDown = iptables -D FORWARD -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "info_hash=" --algo bm --to 1500 -j DROP
PostDown = iptables -D FORWARD -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "get_peers" --algo bm --to 1500 -j DROP
PostDown = iptables -D FORWARD -i %i -m connbytes --connbytes-dir original --connbytes-mode packets --connbytes 1:4 -m string --string "announce_peer" --algo bm --to 1500 -j DROP
PostDown = iptables -D FORWARD -i %i -p tcp -m multiport --dports 6881:6889 -j DROP
PostDown = iptables -D FORWARD -i %i -p udp -m multiport --dports 6881:6889 -j DROP
PostDown = iptables -D FORWARD -i %i -o eno1 -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o eno1 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -o wg0 -j DROP
PostDown = iptables -D FORWARD -i %i -o wg-snr -j DROP

[Peer]
# Клиент: Orange Pi 4 LTS
PublicKey = <ORANGE_PI_PUBLIC_KEY>
AllowedIPs = 10.0.20.2/32, 192.168.1.0/24
